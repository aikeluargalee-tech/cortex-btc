name: connectivity-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Binance US
        run: |
          curl -s -o /dev/null -w "binance.us ping: %{http_code}\n" --max-time 20 https://api.binance.us/api/v3/ping || true
          curl -s --max-time 20 "https://api.binance.us/api/v3/ticker/price?symbol=BTCUSDT" | head -c 160 || true; echo
          echo "klines sample:"
          curl -s --max-time 20 "https://api.binance.us/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1" | head -c 400 || true; echo

      - name: Coinbase
        run: |
          curl -s -o /dev/null -w "coinbase candles: %{http_code}\n" --max-time 20 "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=3600" || true
          curl -s --max-time 20 "https://api.exchange.coinbase.com/products/BTC-USD/ticker" | head -c 200 || true; echo

      - name: Kraken
        run: |
          curl -s -o /dev/null -w "kraken ohlc: %{http_code}\n" --max-time 20 "https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=60" || true

      - name: Runner location
        run: |
          curl -s --max-time 20 https://ipinfo.io/json | head -c 220 || true
