<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CORTEX-BTC — Market Stance</title>
<link rel="stylesheet" href="/style.css" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>CORTEX<span>-BTC</span></h1>
        <p>Market stance · spot BTC/USDT</p>
      </div>
    </div>

    <div class="ticker">
      <div class="price" id="price">—</div>
      <div class="ticker-meta">
        <span>BTC / USDT</span>
        <span class="dot">·</span>
        <span id="market-time">awaiting data</span>
      </div>
    </div>

    <div class="status-cluster">
      <span class="pill" id="data-pill">DATA —</span>
      <span class="pill ghost" id="badge">UNVALIDATED</span>
      <button class="btn" id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="crumb">Current stance</div>
    <div class="toolbar-actions">
      <button class="btn small" data-drawer="research" type="button">Research</button>
      <button class="btn small" data-drawer="telemetry" type="button">Telemetry</button>
      <button class="btn small" data-drawer="config" type="button">Configuration</button>
      <button class="btn small" data-drawer="audit" type="button">Audit</button>
    </div>
  </div>

  <main id="view" class="view">
    <div class="loading">Connecting to CORTEX…</div>
  </main>

  <footer class="footer">
    <span>Not financial advice · observation only · no execution · spot only</span>
    <span id="footer-status">strategy status: UNVALIDATED</span>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-hidden="true">
  <div class="drawer-head">
    <h2 id="drawer-title">Detail</h2>
    <button class="btn small" id="drawer-close" type="button">Close</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="toast" id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
